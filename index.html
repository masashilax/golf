<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="V & O golf">
    <meta name="format-detection" content="telephone=no">

    <title>V & O golf</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
            background-color: #f3f4f6; 
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            min-height: 100vh;
        }
        input, select, textarea { 
            font-size: 16px !important; 
            box-sizing: border-box !important;
        }
        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        .btn-press:active { transform: scale(0.96); opacity: 0.9; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .medal-btn { transition: all 0.2s; position: relative; }
        .medal-btn.active { transform: scale(1.1); box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .medal-btn.disabled { opacity: 0.15; pointer-events: none; filter: grayscale(100%); }

        .opt-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(65px, 1fr)); 
            gap: 6px;
            margin-top: 8px;
        }
        
        .opt-btn { 
            font-size: 0.65rem; 
            padding: 6px 2px; 
            border-radius: 6px; 
            border: 1px solid #e5e7eb; 
            background: white; 
            color: #6b7280; 
            transition: all 0.2s;
            white-space: nowrap;
            text-align: center;
            font-weight: 500;
            position: relative;
        }
        
        .opt-btn.active { background: #eff6ff; border-color: #3b82f6; color: #2563eb; font-weight: bold; }
        .opt-btn.active-red { background: #fef2f2; border-color: #ef4444; color: #dc2626; font-weight: bold; }
        .opt-btn.active-gold { background: #fefce8; border-color: #eab308; color: #a16207; font-weight: bold; }
        
        .opt-btn.placeholder {
            border-style: dashed;
            background: transparent;
            color: #d1d5db;
            opacity: 0.6;
        }

        .opt-btn.achieved { 
            background: linear-gradient(135deg, #fef9c3 0%, #facc15 100%); 
            border-color: #eab308; 
            color: #713f12; 
            font-weight: 900; 
            box-shadow: 0 2px 4px rgba(234, 179, 8, 0.4);
            transform: scale(1.05);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(234, 179, 8, 0.4); }
            70% { box-shadow: 0 0 0 6px rgba(234, 179, 8, 0); }
            100% { box-shadow: 0 0 0 0 rgba(234, 179, 8, 0); }
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #d1d5db;
            transition: .4s;
            border-radius: 24px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 18px; width: 18px;
            left: 3px; bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider { background-color: #16a34a; }
        input:checked + .slider:before { transform: translateX(20px); }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .animate-fade-in { animation: fadeIn 0.2s ease-out forwards; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const generateId = () => Math.random().toString(36).substr(2, 9);
        const getToday = () => new Date().toISOString().split('T')[0];
        const scrollToTop = () => window.scrollTo({ top: 0, behavior: 'smooth' });

        const calcOlympicRelative = (pId, allPointsMap) => {
            const dataMap = allPointsMap || {};
            const pIds = Object.keys(dataMap);
            if (pIds.length === 0) return 0;
            const myPoint = dataMap[pId] || 0;
            const totalSum = pIds.reduce((sum, id) => sum + (dataMap[id] || 0), 0);
            return (myPoint * pIds.length) - totalSum;
        };

        const App = () => {
            const [view, setView] = useState('HOME');
            const [games, setGames] = useState([]);
            const [activeGameId, setActiveGameId] = useState(null);
            const [showExitConfirm, setShowExitConfirm] = useState(false);
            const [showRules, setShowRules] = useState(false);

            const [setupInfo, setSetupInfo] = useState({
                course: '',
                date: getToday(),
                startSide: 'OUT',
                playerData: [
                    { name: '', order: 1 },
                    { name: '', order: 2 },
                    { name: '', order: 3 },
                    { name: '', order: 4 }
                ],
                // 設定初期値に新しいオプションを追加 (fourCard, straight, nearPinCarry)
                settings: { vegas: true, olympic: true, vegasLogic: 'basic', fourCard: true, straight: true, nearPinCarry: true }
            });

            const navigateTo = (nextView) => {
                setView(nextView);
                window.scrollTo({ top: 0, behavior: 'instant' });
            };

            useEffect(() => {
                const saved = localStorage.getItem('golf_vegas_data');
                if (saved) {
                    try {
                        setGames(JSON.parse(saved));
                    } catch(e) {
                        setGames([]);
                    }
                }
            }, []);

            useEffect(() => {
                localStorage.setItem('golf_vegas_data', JSON.stringify(games));
            }, [games]);

            const createGame = (finalSetup) => {
                const newGame = {
                    id: generateId(),
                    date: finalSetup.date,
                    course: finalSetup.course,
                    players: finalSetup.players || [],
                    scores: [],
                    currentHole: finalSetup.startHole || 1,
                    currentOrder: finalSetup.currentOrder || [],
                    totalVegasPoints: (finalSetup.players || []).reduce((a,p)=>({...a,[p.id]:0}),{}),
                    totalOlympicPoints: (finalSetup.players || []).reduce((a,p)=>({...a,[p.id]:0}),{}),
                    // 設定をそのまま渡す
                    settings: finalSetup.settings || { vegas: true, olympic: true, vegasLogic: 'basic', fourCard: true, straight: true, nearPinCarry: true },
                    vegasMultiplier: 1,
                    nearPinCarryCount: 0, // ニアピン持ち越しカウント初期化
                    isFinished: false
                };
                setGames(prev => [newGame, ...prev]);
                setActiveGameId(newGame.id);
                navigateTo('GAME');
            };

            const updateGame = (updatedGame) => {
                setGames(prev => prev.map(g => g.id === updatedGame.id ? updatedGame : g));
            };

            const deleteGame = (id) => {
                setGames(prev => prev.filter(g => g.id !== id));
            };

            const activeGame = games.find(g => g.id === activeGameId);

            return (
                <div className="max-w-md mx-auto min-h-screen bg-gray-100 flex flex-col relative">
                    <div className="bg-green-700 text-white p-4 pt-4 shadow-lg sticky top-0 z-50 flex justify-between items-center border-b border-green-800">
                        <h1 className="text-lg font-bold flex items-center gap-2 truncate mr-2 italic pr-2">
                            <i className="fa-solid fa-golf-ball-tee"></i> V & O golf
                        </h1>
                        <div className="flex gap-2 items-center flex-shrink-0">
                            <button onClick={() => { setShowRules(true); scrollToTop(); }} className="text-xs bg-green-600/50 px-3 py-2 rounded-lg font-bold shadow-sm active:bg-green-800 text-white border border-green-500/30">
                                <i className="fa-solid fa-circle-info"></i>
                            </button>
                            {view !== 'HOME' && (
                                <button 
                                    onClick={() => { setShowExitConfirm(true); scrollToTop(); }} 
                                    className="text-xs bg-red-600 px-3 py-2 rounded-lg font-bold shadow-sm active:bg-red-700 text-white border border-red-500"
                                >
                                    終了
                                </button>
                            )}
                            <button onClick={() => window.location.reload()} className="text-xs bg-green-800 px-3 py-2 rounded-lg font-bold shadow-sm active:bg-green-900 text-white border border-green-600/50">
                                <i className="fa-solid fa-rotate-right"></i>
                            </button>
                        </div>
                    </div>

                    <div className="flex-1 p-4 pb-24 safe-area-bottom">
                        {view === 'HOME' && (
                            <HomeScreen 
                                games={games} 
                                onNew={() => navigateTo('NEW')} 
                                onSelect={(id) => { setActiveGameId(id); navigateTo('GAME'); }} 
                                onDelete={(id) => deleteGame(id)} 
                            />
                        )}
                        {view === 'NEW' && (
                            <NewGameScreen 
                                setupInfo={setupInfo}
                                setSetupInfo={setSetupInfo}
                                onCancel={() => navigateTo('HOME')} 
                                onCreate={createGame} 
                            />
                        )}
                        {view === 'GAME' && activeGame && (
                            <GameScreen 
                                game={activeGame} 
                                onUpdate={updateGame} 
                                onBack={() => navigateTo('HOME')} 
                                onRestartSetup={() => {
                                    deleteGame(activeGame.id);
                                    navigateTo('NEW');
                                }}
                            />
                        )}
                    </div>

                    {showExitConfirm && (
                        <div className="fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-[200] animate-fade-in backdrop-blur-sm">
                            <div className="bg-white rounded-3xl w-full max-w-sm p-6 text-center shadow-2xl">
                                <div className="w-16 h-16 bg-red-50 rounded-full flex items-center justify-center mx-auto mb-4">
                                    <i className="fa-solid fa-door-open text-red-500 text-3xl"></i>
                                </div>
                                <h3 className="text-gray-800 text-lg font-black mb-2">終了確認</h3>
                                <p className="text-gray-500 text-sm mb-6 leading-relaxed">編集を終了して<br/>ホーム画面に戻りますか？</p>
                                <div className="flex gap-3">
                                    <button onClick={() => setShowExitConfirm(false)} className="flex-1 py-3.5 bg-gray-100 text-gray-500 rounded-xl font-bold btn-press">キャンセル</button>
                                    <button onClick={() => { setShowExitConfirm(false); navigateTo('HOME'); }} className="flex-1 py-3.5 bg-red-600 text-white rounded-xl font-bold shadow-lg btn-press">終了する</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {showRules && <RulesModal onClose={() => setShowRules(false)} />}
                </div>
            );
        };

        const RulesModal = ({ onClose }) => (
            <div className="fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-[300] backdrop-blur-sm animate-fade-in">
                <div className="bg-white rounded-3xl w-full max-sm p-6 shadow-2xl relative overflow-hidden max-h-[90vh] flex flex-col">
                    <div className="absolute top-0 left-0 w-full h-2 bg-green-600"></div>
                    <h3 className="text-gray-800 text-xl font-black mb-4 text-center">ルール一覧</h3>
                    <div className="flex-1 overflow-y-auto no-scrollbar space-y-6 text-xs text-gray-600 leading-relaxed">
                        <section>
                            <h4 className="font-bold text-blue-600 border-b border-blue-100 pb-1 mb-2">ラスベガス (Vegas)</h4>
                            <ul className="list-disc pl-4 space-y-1">
                                <li><strong>チーム分け:</strong> 基本は打順1&4 vs 2&3 (3人時は1&3 vs 2位×2)</li>
                                <li><strong>点数算出:</strong> チーム2人のスコアを小→大の順に並べた2桁同士の差で比較</li>
                                <li><strong>倍率:</strong> イーグル獲得、またはチーム2人バーディで2倍</li>
                                <li><strong>キャリー:</strong> 同点時は次ホール倍率+1で持ち越し</li>
                            </ul>
                        </section>
                        <section>
                            <h4 className="font-bold text-yellow-600 border-b border-yellow-100 pb-1 mb-2">オリンピック (Olympic)</h4>
                            <ul className="list-disc pl-4 space-y-1">
                                <li><strong>メダル:</strong> 💎5点、🥇4点、🥈3点、🥉2点、🔩1点</li>
                                <li><strong>逆オリ:</strong> 獲得したメダルの点数がマイナスになります。<strong>逆オリメダルは実績にはカウントされません。</strong></li>
                                <li><strong>実績:</strong> 逆オリを除いた通常メダルで判定。</li>
                            </ul>
                        </section>
                    </div>
                    <button onClick={onClose} className="w-full mt-6 py-4 bg-green-600 text-white rounded-2xl font-bold shadow-md btn-press">閉じる</button>
                </div>
            </div>
        );

        const HomeScreen = ({ games, onNew, onSelect, onDelete }) => {
            const [deleteTarget, setDeleteTarget] = useState(null);
            return (
                <div className="space-y-6">
                    <div>
                        <h2 className="text-gray-500 text-xs font-bold mb-3 uppercase tracking-wider ml-1">履歴 ({games.length})</h2>
                        {games.length === 0 && <p className="text-center text-gray-400 py-12 bg-white rounded-xl border border-dashed border-gray-300">履歴がありません</p>}
                        <div className="space-y-3">
                            {games.map(game => {
                                const totalPar = (game.scores || []).reduce((sum, h) => sum + (h.par || 0), 0);
                                return (
                                    <div key={game.id} onClick={() => onSelect(game.id)} className="bg-white p-4 rounded-xl shadow-sm border border-gray-100 active:bg-gray-50 transition cursor-pointer relative overflow-hidden btn-press">
                                        <div className="absolute top-0 left-0 w-1.5 h-full bg-green-500"></div>
                                        <div className="flex justify-between items-start pl-3 mb-2">
                                            <div>
                                                <h3 className="font-bold text-gray-800 text-lg leading-tight">
                                                    {game.course || 'コース未設定'}
                                                    {totalPar > 0 && <span className="ml-2 text-xs text-gray-400 font-normal italic">Par {totalPar}</span>}
                                                </h3>
                                                <p className="text-gray-400 text-xs mt-1 font-medium"><i className="far fa-calendar-alt mr-1"></i>{game.date}</p>
                                            </div>
                                            <button onClick={(e) => {
                                                e.stopPropagation();
                                                setDeleteTarget(game.id);
                                            }} className="text-gray-300 hover:text-red-500 p-2 -mr-2 -mt-2">
                                                <i className="fa-solid fa-trash"></i>
                                            </button>
                                        </div>
                                        <div className="pl-3 grid grid-cols-2 gap-x-2 gap-y-2">
                                            {(game.players || []).map((p, i) => {
                                                const vP = game.totalVegasPoints ? (game.totalVegasPoints[p.id] || 0) : 0;
                                                const relOP = calcOlympicRelative(p.id, game.totalOlympicPoints || {});
                                                const totalStrokes = (game.scores || []).reduce((sum, h) => sum + (parseInt(h.scores?.[p.id]) || 0), 0);
                                                const diff = totalStrokes - totalPar;
                                                const diffText = diff === 0 ? 'E' : (diff > 0 ? '+' + diff : diff);
                                                const diffColorClass = diff === 0 ? 'text-black' : (diff > 0 ? 'text-red-500' : 'text-blue-600');
                                                return (
                                                    <div key={i} className="text-[10px] text-gray-500 border-b border-gray-50 pb-1 flex flex-col">
                                                        <span className="font-bold text-gray-700 truncate mb-0.5">{p.name}</span>
                                                        <div className="flex flex-wrap gap-x-2">
                                                            {game.settings?.vegas && (
                                                                <span className="whitespace-nowrap"><span className="font-bold text-gray-900">V:</span> <span className={vP >= 0 ? (vP === 0 ? 'text-gray-500' : 'text-blue-600 font-bold') : 'text-red-500 font-bold'}>{vP > 0 ? '+' : ''}{vP}</span></span>
                                                            )}
                                                            {game.settings?.olympic && (
                                                                <span className="whitespace-nowrap"><span className="font-bold text-gray-900">O:</span> <span className={relOP >= 0 ? (relOP === 0 ? 'text-gray-500' : 'text-blue-600 font-bold') : 'text-red-500 font-bold'}>{relOP > 0 ? '+' : ''}{relOP}</span></span>
                                                            )}
                                                            <span className="whitespace-nowrap"><span className="font-bold text-gray-900">T:</span> <span className="text-gray-800 font-bold">{totalStrokes || '-'}</span> {totalStrokes > 0 && <span className={`ml-0.5 font-bold ${diffColorClass}`}>({diffText})</span>}</span>
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                    {deleteTarget && (
                        <div className="fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-[210] animate-fade-in backdrop-blur-sm">
                            <div className="bg-white rounded-3xl w-full max-sm p-6 text-center shadow-2xl">
                                <div className="w-16 h-16 bg-red-50 rounded-full flex items-center justify-center mx-auto mb-4"><i className="fa-solid fa-trash-can text-red-500 text-3xl"></i></div>
                                <h3 className="text-gray-800 text-lg font-black mb-2">履歴の削除</h3>
                                <p className="text-gray-500 text-sm mb-6">完全に削除しますか？</p>
                                <div className="flex gap-3">
                                    <button onClick={() => setDeleteTarget(null)} className="flex-1 py-3.5 bg-gray-100 text-gray-500 rounded-xl font-bold btn-press">戻る</button>
                                    <button onClick={() => { onDelete(deleteTarget); setDeleteTarget(null); }} className="flex-1 py-3.5 bg-red-600 text-white rounded-xl font-bold shadow-lg btn-press">削除</button>
                                </div>
                            </div>
                        </div>
                    )}
                    <button onClick={onNew} className="fixed bottom-10 right-6 md:right-[calc(50%-180px)] w-16 h-16 bg-green-600 hover:bg-green-700 text-white rounded-full shadow-2xl flex items-center justify-center text-3xl btn-press z-50"><i className="fa-solid fa-plus"></i></button>
                </div>
            );
        };

        const NewGameScreen = ({ setupInfo, setSetupInfo, onCancel, onCreate }) => {
            const handleSubmit = () => {
                if (!setupInfo.course) { alert('ゴルフ場名を入力してください'); return; }
                const activePlayersData = setupInfo.playerData.filter(p => p.name.trim() !== '');
                if (activePlayersData.length < 3) { alert('最低3名のプレイヤー名を入力してください'); return; }

                const players = activePlayersData.map((p, i) => ({ id: String(i), name: p.name }));
                const initialIds = players.map(p => p.id);
                const currentOrder = [...initialIds].sort((a, b) => {
                    const orderA = activePlayersData[parseInt(a)]?.order || 0;
                    const orderB = activePlayersData[parseInt(b)]?.order || 0;
                    return orderA - orderB;
                });

                onCreate({ 
                    date: setupInfo.date, 
                    course: setupInfo.course, 
                    players, 
                    settings: setupInfo.settings, 
                    currentOrder, 
                    startHole: setupInfo.startSide === 'OUT' ? 1 : 10 
                });
            };

            const updatePlayer = (idx, field, val) => {
                const newData = [...setupInfo.playerData];
                newData[idx][field] = val;
                setSetupInfo({...setupInfo, playerData: newData});
            };

            const resetPlayers = () => setSetupInfo({
                ...setupInfo,
                playerData: [
                    { name: { name: '', order: 1 }, { name: '', order: 2 }, { name: '', order: 3 }, { name: '', order: 4 }
                ]
            });

            return (
                <div className="bg-white rounded-2xl shadow-sm p-5 space-y-6">
                    <h2 className="text-lg font-bold text-center border-b pb-3 text-gray-700">新規ゲーム設定</h2>
                    <div className="space-y-4">
                        <div className="w-full overflow-hidden">
                            <label className="block text-xs font-bold text-gray-500 mb-1 uppercase">日付</label>
                            <input 
                                type="date" 
                                value={setupInfo.date} 
                                onChange={(e) => setSetupInfo({...setupInfo, date: e.target.value})} 
                                className="w-full block box-border p-3 bg-gray-50 rounded-xl font-bold text-gray-800 outline-none h-12 max-w-full appearance-none" 
                            />
                        </div>
                        <div>
                            <label className="block text-xs font-bold text-gray-500 mb-1 uppercase">ゴルフ場名</label>
                            <input 
                                type="text" 
                                value={setupInfo.course} 
                                onChange={(e) => setSetupInfo({...setupInfo, course: e.target.value})} 
                                className="w-full block box-border p-3 bg-gray-50 rounded-xl font-bold text-gray-800 h-12" 
                            />
                        </div>
                        <div>
                            <label className="block text-xs font-bold text-gray-500 mb-1 uppercase">モード</label>
                            <div className="bg-gray-50 p-4 rounded-xl space-y-3">
                                <div className="flex justify-between items-center">
                                    <span className="text-sm font-bold text-gray-700">ラスベガス (チーム戦)</span>
                                    <label className="switch"><input type="checkbox" checked={setupInfo.settings.vegas} onChange={() => setSetupInfo({...setupInfo, settings: {...setupInfo.settings, vegas: !setupInfo.settings.vegas}})} /><span className="slider"></span></label>
                                </div>
                                {setupInfo.settings.vegas && (
                                    <div className="pl-4 py-2 border-l-2 border-blue-200 animate-fade-in">
                                            <label className="block text-[10px] font-bold text-gray-400 uppercase mb-2">チーム分けルール</label>
                                            <div className="flex bg-white rounded-lg p-1 border">
                                                <button 
                                                    onClick={() => setSetupInfo({...setupInfo, settings: {...setupInfo.settings, vegasLogic: 'basic'}})}
                                                    className={`flex-1 py-1.5 rounded-md text-[10px] font-bold transition ${setupInfo.settings.vegasLogic === 'basic' ? 'bg-blue-600 text-white shadow' : 'text-gray-400'}`}
                                                >基本(14vs23)</button>
                                                <button 
                                                    onClick={() => setSetupInfo({...setupInfo, settings: {...setupInfo.settings, vegasLogic: 'original'}})}
                                                    className={`flex-1 py-1.5 rounded-md text-[10px] font-bold transition ${setupInfo.settings.vegasLogic === 'original' ? 'bg-blue-600 text-white shadow' : 'text-gray-400'}`}
                                                >オリジナル(手動)</button>
                                            </div>
                                    </div>
                                )}
                                <div className="flex justify-between items-center">
                                    <span className="text-sm font-bold text-gray-700">オリンピック (パター戦)</span>
                                    <label className="switch"><input type="checkbox" checked={setupInfo.settings.olympic} onChange={() => setSetupInfo({...setupInfo, settings: {...setupInfo.settings, olympic: !setupInfo.settings.olympic}})} /><span className="slider"></span></label>
                                </div>
                                {setupInfo.settings.olympic && (
                                    <div className="pl-4 py-2 border-l-2 border-yellow-200 animate-fade-in grid grid-cols-2 gap-2">
                                        <label className="flex items-center gap-2 bg-white p-2 rounded border border-gray-100">
                                            <input type="checkbox" checked={setupInfo.settings.fourCard} onChange={() => setSetupInfo({...setupInfo, settings: {...setupInfo.settings, fourCard: !setupInfo.settings.fourCard}})} className="rounded text-green-600 focus:ring-green-500" />
                                            <span className="text-[10px] font-bold text-gray-500">4カードあり</span>
                                        </label>
                                        <label className="flex items-center gap-2 bg-white p-2 rounded border border-gray-100">
                                            <input type="checkbox" checked={setupInfo.settings.straight} onChange={() => setSetupInfo({...setupInfo, settings: {...setupInfo.settings, straight: !setupInfo.settings.straight}})} className="rounded text-green-600 focus:ring-green-500" />
                                            <span className="text-[10px] font-bold text-gray-500">ストレートあり</span>
                                        </label>
                                        <label className="flex items-center gap-2 bg-white p-2 rounded border border-gray-100 col-span-2">
                                            <input type="checkbox" checked={setupInfo.settings.nearPinCarry} onChange={() => setSetupInfo({...setupInfo, settings: {...setupInfo.settings, nearPinCarry: !setupInfo.settings.nearPinCarry}})} className="rounded text-green-600 focus:ring-green-500" />
                                            <span className="text-[10px] font-bold text-gray-500">ニアピンキャリーオーバー(＋3点ずつ)</span>
                                        </label>
                                    </div>
                                )}
                            </div>
                        </div>
                        <div className="flex gap-2">
                            <button onClick={() => setSetupInfo({...setupInfo, startSide: 'OUT'})} className={`flex-1 py-3 rounded-xl font-bold ${setupInfo.startSide === 'OUT' ? 'bg-green-600 text-white shadow' : 'bg-gray-100 text-gray-400'}`}>OUT</button>
                            <button onClick={() => setSetupInfo({...setupInfo, startSide: 'IN'})} className={`flex-1 py-3 rounded-xl font-bold ${setupInfo.startSide === 'IN' ? 'bg-green-600 text-white shadow' : 'bg-gray-100 text-gray-400'}`}>IN</button>
                        </div>
                        <div className="space-y-4">
                            <div className="flex justify-between items-end mb-1">
                                <label className="block text-xs font-bold text-gray-500 uppercase">メンバーと初期打順（3名以上）</label>
                                <button onClick={resetPlayers} className="text-[10px] text-green-600 font-bold bg-green-50 px-2 py-1 rounded">クリア</button>
                            </div>
                            {setupInfo.playerData.map((p, i) => (
                                <div key={i} className="flex gap-2">
                                    <input type="text" value={p.name} onChange={(e) => updatePlayer(i, 'name', e.target.value)} placeholder={`プレイヤー${i+1}`} className="flex-1 p-2.5 bg-gray-50 rounded-lg text-sm h-11" />
                                    <select value={p.order} onChange={(e) => updatePlayer(i, 'order', parseInt(e.target.value))} className="w-20 p-2.5 bg-gray-100 rounded-lg text-xs font-bold h-11">
                                        {[1, 2, 3, 4].map(n => <option key={n} value={n}>{n}番目</option>)}
                                    </select>
                                </div>
                            ))}
                        </div>
                    </div>
                    <div className="flex gap-3 pt-2">
                        <button onClick={onCancel} className="flex-1 py-3 bg-gray-100 text-gray-600 rounded-xl font-bold btn-press">キャンセル</button>
                        <button onClick={handleSubmit} className="flex-1 py-3 bg-green-600 text-white rounded-xl font-bold shadow-md btn-press">開始</button>
                    </div>
                </div>
            );
        };

        const GameScreen = ({ game, onUpdate, onBack, onRestartSetup }) => {
            const [par, setPar] = useState(4);
            const [scores, setScores] = useState((game.players || []).reduce((a,p)=>({...a,[p.id]:''}),{}));
            const [showFinal, setShowFinal] = useState(false);
            const [showOlympic, setShowOlympic] = useState(game.settings?.olympic || !game.settings?.vegas);
            const [olympicMedals, setOlympicMedals] = useState({}); 
            const [undoConfirm, setUndoConfirm] = useState(false); 
            const [setupConfirm, setSetupConfirm] = useState(false);
            const [editingIndex, setEditingIndex] = useState(null);

            const isThree = (game.players || []).length === 3;
            const [manualTeamA, setManualTeamA] = useState([]);

            const initialOpts = {
                rodState: 0, sand: false, near: false, reverse: false, 
                birdie: false, eagle: false, four: false, straight: false, manualAdj: ''
            };
            const [playerOptions, setPlayerOptions] = useState((game.players || []).reduce((a,p)=>({...a,[p.id]:{...initialOpts}}),{}));

            const MEDAL_PTS = { diamond: 5, gold: 4, silver: 3, bronze: 2, iron: 1 };
            const MEDAL_REVERSE_PTS = { diamond: -5, gold: -1, silver: -2, bronze: -3, iron: -4 };

            const getAchievementCounts = (pId, currentMedal, currentIsReverse) => {
                let counts = { diamond: 0, gold: 0, silver: 0, bronze: 0, iron: 0 };
                (game.scores || []).forEach((h, idx) => {
                    if (editingIndex === idx) return;
                    const m = h.medals && h.medals[pId];
                    const wasReverse = h.reverseStates && h.reverseStates[pId];
                    if (m && !wasReverse) counts[m]++;
                });
                if (currentMedal && !currentIsReverse) counts[currentMedal]++;
                return counts;
            };

            const calcStraightSets = (counts) => {
                let sets = 0, c = { ...counts };
                while (true) {
                    let needed = ['gold', 'silver', 'bronze', 'iron'], missing = 0;
                    needed.forEach(m => { if (!c[m] || c[m] <= 0) missing++; });
                    if (missing === 0) { needed.forEach(m => c[m]--); sets++; }
                    else if (c['diamond'] >= missing) {
                        needed.forEach(m => { if (c[m] > 0) c[m]--; });
                        c['diamond'] -= missing; sets++;
                    } else break;
                }
                return sets;
            };

            useEffect(() => {
                if (game.settings?.vegasLogic === 'original' && game.currentOrder) {
                    const defaultA = isThree ? [game.currentOrder[0], game.currentOrder[2]] : [game.currentOrder[0], game.currentOrder[3]];
                    setManualTeamA(defaultA.filter(id => id !== undefined));
                }
            }, [game.currentHole, game.settings?.vegasLogic]);

            useEffect(() => {
                setPlayerOptions(prev => {
                    const next = { ...prev };
                    (game.players || []).forEach(p => {
                        const counts = getAchievementCounts(p.id, olympicMedals[p.id], next[p.id]?.reverse);
                        const prevCounts = getAchievementCounts(p.id, null, false); 
                        
                        let isFourCard = false;
                        ['diamond', 'gold', 'silver', 'bronze', 'iron'].forEach(type => {
                            if (counts[type] > 0 && counts[type] % 4 === 0 && counts[type] !== prevCounts[type]) isFourCard = true;
                        });
                        
                        const isStraight = calcStraightSets(counts) > calcStraightSets(prevCounts);
                        const sVal = parseInt(scores[p.id]);

                        next[p.id] = { 
                            ...initialOpts,
                            ...next[p.id], 
                            four: isFourCard, 
                            straight: isStraight,
                            birdie: !isNaN(sVal) ? sVal === par - 1 : (next[p.id]?.birdie || false),
                            eagle: !isNaN(sVal) ? sVal <= par - 2 : (next[p.id]?.eagle || false)
                        };
                    });
                    return next;
                });
            }, [olympicMedals, scores, par, JSON.stringify(Object.values(playerOptions).map(o => o.reverse))]);

            const takenMedals = useMemo(() => {
                return Object.entries(olympicMedals).reduce((acc, [id, type]) => { acc[type] = id; return acc; }, {});
            }, [olympicMedals]);

            const toggleManualTeam = (pid) => {
                setManualTeamA(prev => {
                    if (prev.includes(pid)) return prev.filter(id => id !== pid);
                    if (prev.length < 2) return [...prev, pid];
                    return prev;
                });
            };

            const handleCalculateAndSave = () => {
                for(let p of (game.players || [])) { if(scores[p.id] === '') { alert('全員のスコアを入力してください'); return; } }
                const s = (pid) => parseInt(scores[pid]) || 0;
                
                let team1 = [], team2 = [];
                if (editingIndex !== null) {
                     const targetHole = game.scores[editingIndex];
                     if (game.settings?.vegasLogic === 'original') {
                        team1 = manualTeamA;
                        team2 = (game.players || []).filter(p => !manualTeamA.includes(p.id)).map(p => p.id);
                        if (isThree) team2 = [team2[0], team2[0]];
                      } else {
                        const order = targetHole.orderBefore || [];
                        team1 = isThree ? [order[0], order[2]] : [order[0], order[3]];
                        team2 = isThree ? [order[1], order[1]] : [order[1], order[2]];
                      }
                } else {
                    if (game.settings?.vegasLogic === 'original') {
                        if (isThree) {
                            if (manualTeamA.length !== 2) { alert('先行チームを2名選択してください'); return; }
                            team1 = manualTeamA;
                            const singletonId = (game.players || []).find(p => !manualTeamA.includes(p.id))?.id;
                            team2 = [singletonId, singletonId];
                        } else {
                            if (manualTeamA.length !== 2) { alert('先行チームを2名選択してください'); return; }
                            team1 = manualTeamA;
                            team2 = (game.players || []).filter(p => !manualTeamA.includes(p.id)).map(p => p.id);
                        }
                    } else {
                        const order = game.currentOrder || [];
                        team1 = isThree ? [order[0], order[2]] : [order[0], order[3]];
                        team2 = isThree ? [order[1], order[1]] : [order[1], order[2]];
                    }
                }

                let vegasDiff = 0, olympicPoints = {};
                const currentMultiplier = editingIndex !== null ? (game.scores[editingIndex]?.multiplierUsed || 1) : (game.vegasMultiplier || 1);
                
                if (game.settings?.vegas) {
                    const t1S = team1.map(pid => s(pid)), t2S = team2.map(pid => s(pid));
                    let p1 = Math.min(...t1S) * 10 + Math.max(...t1S), p2 = Math.min(...t2S) * 10 + Math.max(...t2S);
                    const checkV = (scs) => {
                        const hasE = scs.some(sc => sc <= par - 2), bCount = scs.filter(sc => sc <= par - 1).length;
                        return { rank: (hasE || bCount === 2) ? 2 : (bCount > 0 ? 1 : 0) };
                    };
                    const res1 = checkV(t1S), res2 = checkV(t2S);
                    let mult = 1;
                    if (res1.rank > 0) { if (res1.rank === 2) mult *= 2; p2 = Math.max(...t2S) * 10 + Math.min(...t2S); }
                    if (res2.rank > 0) { if (res2.rank === 2) mult *= 2; p1 = Math.min(...t1S) * 10 + Math.min(...t1S); }
                    vegasDiff = (Math.ceil(Math.abs(p2 - p1) * mult / 5) * 5) * (p2 - p1 < 0 ? -1 : 1) * currentMultiplier;
                }

                // ニアピンキャリーオーバー判定用
                const currentNearPinCarry = game.nearPinCarryCount || 0;
                const isPar3 = par === 3;
                let someoneGotNear = false;
                if (game.settings?.olympic && isPar3) {
                    someoneGotNear = (game.players || []).some(p => playerOptions[p.id]?.near && !playerOptions[p.id]?.reverse);
                }

                (game.players || []).forEach(p => {
                    const opt = playerOptions[p.id] || initialOpts;
                    const medal = olympicMedals[p.id];
                    let pts = 0;
                    if (s(p.id) === par - 1) pts += 3; else if (s(p.id) <= par - 2) pts += 15;
                    if (opt.sand) pts += 3; if (opt.rodState === 1) pts += 3; else if (opt.rodState === -1) pts -= 3;
                    if (medal) pts += (opt.reverse ? MEDAL_REVERSE_PTS[medal] : MEDAL_PTS[medal]);
                    
                    // ニアピン計算（キャリーオーバー対応）
                    if (isPar3 && opt.near && !opt.reverse) {
                        const multiplier = game.settings?.nearPinCarry ? (currentNearPinCarry + 1) : 1;
                        pts += (3 * multiplier);
                    }
                    
                    // 4カード（オプション判定）
                    if (game.settings?.fourCard && opt.four) {
                        const c = getAchievementCounts(p.id, medal, opt.reverse);
                        ['diamond','gold','silver','bronze','iron'].forEach(t => { if(c[t]>0 && c[t]%4===0) pts += (MEDAL_PTS[t]*4); });
                    }

                    // ストレート（オプション判定）
                    if (game.settings?.straight && opt.straight) {
                        pts += (getAchievementCounts(p.id, medal, opt.reverse).diamond > 0 ? 15 : 10);
                    }

                    pts += (parseInt(opt.manualAdj) || 0);
                    olympicPoints[p.id] = pts;
                });

                const updatedHoleData = { 
                    hole: editingIndex !== null ? game.scores[editingIndex].hole : game.currentHole, 
                    par, vegasDiff, olympicPoints, scores: { ...scores }, 
                    teams: { t1: team1, t2: Array.from(new Set(team2.filter(x => x !== undefined))) }, medals: { ...olympicMedals }, 
                    reverseStates: (game.players || []).reduce((a,p)=>({...a,[p.id]:!!playerOptions[p.id]?.reverse}), {}),
                    orderBefore: editingIndex !== null ? (game.scores[editingIndex].orderBefore || []) : [...(game.currentOrder || [])],
                    multiplierUsed: currentMultiplier,
                    achievements: (game.players || []).reduce((a,p)=>({...a,[p.id]:{four:!!playerOptions[p.id]?.four,straight:!!playerOptions[p.id]?.straight}}),{})
                };

                let newHistory = [...(game.scores || [])];
                if (editingIndex !== null) {
                    newHistory[editingIndex] = updatedHoleData;
                } else {
                    newHistory.push(updatedHoleData);
                }
                
                const newVegasTotal = (game.players || []).reduce((a,p)=>({...a,[p.id]:0}),{});
                const newOlympicTotal = (game.players || []).reduce((a,p)=>({...a,[p.id]:0}),{});
                
                newHistory.forEach(h => {
                    (game.players || []).forEach(p => {
                        if (h.teams?.t1 && h.teams?.t2) {
                            if (isThree) {
                                if (h.teams.t1.includes(p.id)) newVegasTotal[p.id] += h.vegasDiff;
                                else newVegasTotal[p.id] += (-h.vegasDiff * 2);
                            } else {
                                newVegasTotal[p.id] += (h.teams.t1.includes(p.id) ? h.vegasDiff : -h.vegasDiff);
                            }
                        }
                        newOlympicTotal[p.id] += (h.olympicPoints?.[p.id] || 0);
                    });
                });

                const nextOrder = editingIndex !== null 
                    ? (game.currentOrder || []) 
                    : [...(game.currentOrder || [])].sort((a,b) => s(a)-s(b) || (game.currentOrder || []).indexOf(a)-(game.currentOrder || []).indexOf(b));

                const nextHole = editingIndex !== null ? game.currentHole : (game.currentHole === 18 ? 1 : game.currentHole + 1);
                
                let nextMult = game.vegasMultiplier || 1;
                if (editingIndex === null && game.settings?.vegas && vegasDiff === 0) {
                    nextMult += 1;
                } else if (editingIndex === null) {
                    nextMult = 1;
                }

                // ニアピンキャリーカウントの更新
                let nextNearPinCarry = currentNearPinCarry;
                if (editingIndex === null && game.settings?.nearPinCarry && isPar3) {
                    if (someoneGotNear) {
                        nextNearPinCarry = 0; // 獲得者がいればリセット
                    } else {
                        nextNearPinCarry += 1; // 該当なしなら持ち越し
                    }
                }

                onUpdate({ 
                    ...game, 
                    currentHole: nextHole,
                    currentOrder: nextOrder, 
                    totalVegasPoints: newVegasTotal, totalOlympicPoints: newOlympicTotal, 
                    vegasMultiplier: nextMult,
                    nearPinCarryCount: nextNearPinCarry,
                    scores: newHistory 
                });

                setScores((game.players || []).reduce((a,p)=>({...a,[p.id]:''}),{})); setOlympicMedals({}); setPar(4);
                setPlayerOptions((game.players || []).reduce((a,p)=>({...a,[p.id]:{...initialOpts}}),{}));
                setEditingIndex(null);
                scrollToTop();
            };

            const startEditHole = (index) => {
                const targetHole = game.scores[index];
                if (!targetHole) return;
                setPar(targetHole.par || 4);
                setScores(targetHole.scores || {});
                setOlympicMedals(targetHole.medals || {});
                
                if (game.settings?.vegasLogic === 'original' && targetHole.teams?.t1) {
                    setManualTeamA(targetHole.teams.t1);
                }

                setPlayerOptions(prev => {
                    const next = {...prev};
                    (game.players || []).forEach(p => {
                        const isReverse = !!(targetHole.reverseStates && targetHole.reverseStates[p.id]);
                        next[p.id] = { ...initialOpts, reverse: isReverse };
                    });
                    return next;
                });
                
                setEditingIndex(index);
                scrollToTop();
            };

            const handleUndoLastHole = () => {
                const history = [...(game.scores || [])];
                const last = history.pop();
                if (!last) return;
                
                const newVegasTotal = { ...(game.totalVegasPoints || {}) }, newOlympicTotal = { ...(game.totalOlympicPoints || {}) };
                (game.players || []).forEach(p => {
                    if (last.teams?.t1) {
                        if (isThree) {
                            if (last.teams.t1.includes(p.id)) newVegasTotal[p.id] = (newVegasTotal[p.id] || 0) - last.vegasDiff;
                            else newVegasTotal[p.id] = (newVegasTotal[p.id] || 0) - (-last.vegasDiff * 2);
                        } else {
                            newVegasTotal[p.id] = (newVegasTotal[p.id] || 0) - (last.teams.t1.includes(p.id) ? last.vegasDiff : -last.vegasDiff);
                        }
                    }
                    newOlympicTotal[p.id] = (newOlympicTotal[p.id] || 0) - (last.olympicPoints?.[p.id] || 0);
                });
                onUpdate({ 
                    ...game, currentHole: last.hole, currentOrder: last.orderBefore || [], 
                    totalVegasPoints: newVegasTotal, totalOlympicPoints: newOlympicTotal, 
                    vegasMultiplier: last.multiplierUsed || 1, scores: history
                });
                setUndoConfirm(false);
                setTimeout(() => scrollToTop(), 50);
            };

            return (
                <div className="pb-8">
                    {editingIndex !== null && (
                        <div className="mb-4 p-3 bg-yellow-50 border-l-4 border-yellow-400 text-yellow-700 flex justify-between items-center rounded-r-lg shadow-sm animate-fade-in">
                            <div className="font-bold text-sm">Hole {game.scores?.[editingIndex]?.hole} を修正中...</div>
                            <button onClick={() => { setEditingIndex(null); setScores((game.players || []).reduce((a,p)=>({...a,[p.id]:''}),{})); setOlympicMedals({}); setPar(4); }} className="text-xs bg-white border border-yellow-300 px-3 py-1.5 rounded font-bold shadow-sm text-gray-600">中断</button>
                        </div>
                    )}

                    {(game.scores || []).length === 0 && editingIndex === null && (
                        <div className="mb-4">
                            <button onClick={() => { setSetupConfirm(true); scrollToTop(); }} className="w-full py-2.5 bg-gray-200 text-gray-600 rounded-xl font-bold text-xs flex items-center justify-center gap-1.5 active:bg-gray-300 transition btn-press"><i className="fa-solid fa-gear"></i> 設定をやり直す</button>
                        </div>
                    )}

                    <div className="bg-white rounded-2xl shadow-sm p-4 mb-4 text-center border border-gray-100 flex items-center justify-between">
                        <h2 className="text-xl font-bold text-gray-800">Hole {editingIndex !== null ? game.scores?.[editingIndex]?.hole : game.currentHole}</h2>
                        <div className="flex bg-gray-100 rounded-lg p-1">
                            {[3, 4, 5].map(p => (
                                <button key={p} onClick={() => setPar(p)} className={`px-4 py-1.5 rounded-md text-sm font-bold transition ${par === p ? 'bg-green-600 text-white shadow' : 'text-gray-400'}`}>Par {p}</button>
                            ))}
                        </div>
                    </div>

                    {game.settings?.vegas && (
                        <div className="space-y-3">
                            {game.settings?.vegasLogic === 'original' && (
                                <div className="bg-white p-3 rounded-xl border-2 border-dashed border-gray-200 mb-4 animate-fade-in">
                                    <label className="block text-[10px] font-bold text-blue-600 mb-2 uppercase text-center">チーム選択 (2名選択で先行チーム)</label>
                                    <div className="grid grid-cols-2 gap-2">
                                        {(game.players || []).map(p => (
                                            <button key={p.id} onClick={() => toggleManualTeam(p.id)} className={`py-2 rounded-lg text-xs font-bold transition flex items-center justify-center gap-2 border-2 ${manualTeamA.includes(p.id) ? 'bg-blue-50 border-blue-500 text-blue-700' : 'bg-white border-gray-100 text-gray-400'}`}>
                                                {manualTeamA.includes(p.id) ? <i className="fa-solid fa-check"></i> : null}{p.name}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            )}
                            <TeamCard color="blue" label="先行チーム" pIds={editingIndex !== null ? (game.scores?.[editingIndex]?.teams?.t1 || []) : (game.settings?.vegasLogic === 'original' ? manualTeamA : (isThree ? [game.currentOrder?.[0], game.currentOrder?.[2]] : [game.currentOrder?.[0], game.currentOrder?.[3]]))} players={game.players || []} scores={scores} setScores={setScores} par={par} />
                            <div className="text-center font-bold text-gray-300 text-xs tracking-widest uppercase">vs</div>
                            <TeamCard color="red" label={isThree ? "2位 (×2)" : "後攻チーム"} pIds={editingIndex !== null ? (game.scores?.[editingIndex]?.teams?.t2 || []) : (game.settings?.vegasLogic === 'original' ? (game.players || []).filter(p=>!manualTeamA.includes(p.id)).map(p=>p.id).slice(0, isThree?1:2) : (isThree ? [game.currentOrder?.[1]] : [game.currentOrder?.[1], game.currentOrder?.[2]]))} players={game.players || []} scores={scores} setScores={setScores} par={par} />
                        </div>
                    )}

                    {game.settings?.olympic && (
                        <div className="mt-6">
                            <button onClick={() => setShowOlympic(!showOlympic)} className="w-full py-3 bg-gray-200 rounded-xl font-bold flex items-center justify-center gap-2">
                                <i className="fa-solid fa-medal"></i> オリンピック入力 {showOlympic ? '▲' : '▼'}
                            </button>
                            {(showOlympic || !game.settings?.vegas) && (
                                <div className="mt-2 bg-white rounded-xl shadow-sm p-3 border border-yellow-200 space-y-6 animate-fade-in">
                                    {(game.players || []).map(p => {
                                        const opt = playerOptions[p.id] || initialOpts;
                                        const pastFour = (game.scores || []).filter((h, idx) => idx !== editingIndex && h.achievements?.[p.id]?.four).length;
                                        const pastStraight = (game.scores || []).filter((h, idx) => idx !== editingIndex && h.achievements?.[p.id]?.straight).length;
                                        return (
                                            <div key={p.id} className="border-b border-gray-50 pb-3 last:border-0">
                                                <div className="flex items-center justify-between mb-2">
                                                    <div className="flex items-center gap-2">
                                                        <span className="text-sm font-bold text-gray-700 w-16 truncate">{p.name}</span>
                                                        <input type="tel" inputMode="numeric" placeholder={par} value={scores[p.id] || ''} onChange={(e) => setScores({...scores, [p.id]: e.target.value})} className="w-10 text-center text-lg font-black bg-gray-100 rounded focus:ring-0 outline-none p-1" />
                                                    </div>
                                                    <div className="flex gap-1">
                                                        {['diamond', 'gold', 'silver', 'bronze', 'iron'].map(type => {
                                                            const isIron = type === 'iron';
                                                            const isDiamond = type === 'diamond';
                                                            const hasDiamondAnywhere = !!takenMedals['diamond'];
                                                            const hasIronAnywhere = !!takenMedals['iron'];
                                                            let isDisabled = takenMedals[type] && takenMedals[type] !== p.id;
                                                            if (isIron && hasDiamondAnywhere) isDisabled = true;
                                                            if (isDiamond && hasIronAnywhere) isDisabled = true;
                                                            if (isIron && isThree) isDisabled = true;

                                                            return (
                                                                <MedalButton 
                                                                    key={type} type={type} current={olympicMedals[p.id]} 
                                                                    disabled={isDisabled} 
                                                                    isReverse={opt.reverse}
                                                                    onClick={() => setOlympicMedals(prev => prev[p.id] === type ? (()=>{const n={...prev}; delete n[p.id]; return n;})() : {...prev, [p.id]: type})} 
                                                                />
                                                            );
                                                        })}
                                                    </div>
                                                </div>
                                                <div className="opt-grid">
                                                    <button onClick={() => setPlayerOptions(v=>({...v,[p.id]:{...v[p.id],rodState:v[p.id]?.rodState===1?-1:v[p.id]?.rodState===-1?0:1}}))} className={`opt-btn ${opt.rodState===1?'active':opt.rodState===-1?'active-red':''}`}>
                                                        {opt.rodState === -1 ? '竿失敗' : '竿イチ'}
                                                    </button>
                                                    <button onClick={() => setPlayerOptions(v=>({...v,[p.id]:{...v[p.id],sand:!v[p.id]?.sand}}))} className={`opt-btn ${opt.sand?'active':''}`}>砂イチ</button>
                                                    <button 
                                                        onClick={() => setPlayerOptions(v=>({...v,[p.id]:{...v[p.id],near:!v[p.id]?.near}}))} 
                                                        className={`opt-btn ${opt.near?'active-gold':''}`} 
                                                        disabled={par!==3 && game.settings?.vegas}
                                                    >
                                                        ニアピン
                                                        {par === 3 && game.settings?.nearPinCarry && (game.nearPinCarryCount > 0) && <span className="text-[9px] ml-0.5 text-red-500 font-black">x{game.nearPinCarryCount + 1}</span>}
                                                    </button>
                                                    <button onClick={() => setPlayerOptions(v=>({...v,[p.id]:{...v[p.id],reverse:!v[p.id]?.reverse}}))} className={`opt-btn ${opt.reverse?'active-red':''}`}>逆オリ</button>
                                                    <button className={`opt-btn ${opt.birdie?'active':''}`} disabled>バーディ</button>
                                                    <button className={`opt-btn ${opt.eagle?'active-gold':''}`} disabled>イーグル</button>
                                                    {game.settings?.fourCard && (
                                                        <button className={`opt-btn ${opt.four || pastFour > 0 ? 'achieved' : 'placeholder'}`} disabled>4カード{pastFour+(opt.four?1:0)>1?` x${pastFour+(opt.four?1:0)}`:''}</button>
                                                    )}
                                                    {game.settings?.straight && (
                                                        <button className={`opt-btn ${opt.straight || pastStraight > 0 ? 'achieved' : 'placeholder'}`} disabled>ストレート{pastStraight+(opt.straight?1:0)>1?` x${pastStraight+(opt.straight?1:0)}`:''}</button>
                                                    )}
                                                </div>
                                                <div className="mt-2 flex items-center gap-2 justify-end">
                                                    <label className="text-[10px] font-bold text-gray-400">調整:</label>
                                                    <input type="text" value={opt.manualAdj || ''} onChange={(e) => setPlayerOptions(v=>({...v,[p.id]:{...v[p.id],manualAdj:e.target.value.replace(/[^-0-9]/g,'')}}))} className="w-12 text-center text-xs font-bold bg-gray-50 border rounded py-1 outline-none" />
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            )}
                        </div>
                    )}

                    <button onClick={handleCalculateAndSave} className="w-full mt-6 bg-green-600 text-white text-lg font-bold py-4 rounded-2xl shadow-lg btn-press">
                        {editingIndex !== null ? '修正を保存して完了' : '計算して次のホールへ'}
                    </button>

                    <HistorySection game={game} players={game.players || []} onJump={startEditHole} />

                    <button onClick={() => { setShowFinal(true); scrollToTop(); }} className="w-full mt-8 bg-white text-green-600 border-2 border-green-600 text-lg font-bold py-4 rounded-2xl btn-press shadow-sm tracking-wider">現在までの結果を見る</button>

                    {setupConfirm && (
                        <div className="fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-[120] animate-fade-in backdrop-blur-sm">
                            <div className="bg-white rounded-3xl w-full max-sm p-6 text-center shadow-2xl">
                                <div className="w-16 h-16 bg-blue-50 rounded-full flex items-center justify-center mx-auto mb-4"><i className="fa-solid fa-gear text-blue-500 text-3xl"></i></div>
                                <h3 className="text-gray-800 text-lg font-black mb-2">設定のやり直し</h3>
                                <p className="text-gray-500 text-sm mb-6 leading-relaxed">設定画面に戻りますか？<br/>現在のゲームデータは破棄されます。</p>
                                <div className="flex gap-3"><button onClick={() => setSetupConfirm(false)} className="flex-1 py-3.5 bg-gray-100 text-gray-500 rounded-xl font-bold btn-press">キャンセル</button><button onClick={() => { onRestartSetup(); scrollToTop(); }} className="flex-1 py-3.5 bg-blue-600 text-white rounded-xl font-bold shadow-lg btn-press">やり直す</button></div>
                            </div>
                        </div>
                    )}
                    {undoConfirm && (
                         <div className="fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-[110] animate-fade-in backdrop-blur-sm">
                            <div className="bg-white rounded-3xl w-full max-sm p-6 text-center shadow-2xl">
                                <div className="w-16 h-16 bg-red-50 rounded-full flex items-center justify-center mx-auto mb-4"><i className="fa-solid fa-triangle-exclamation text-red-500 text-3xl"></i></div>
                                <h3 className="text-gray-800 text-lg font-black mb-2">削除</h3>
                                <p className="text-gray-500 text-sm mb-6">直前の入力を削除しますか？</p>
                                <div className="flex gap-3"><button onClick={() => setUndoConfirm(false)} className="flex-1 py-3.5 bg-gray-100 text-gray-500 rounded-xl font-bold btn-press">戻る</button><button onClick={handleUndoLastHole} className="flex-1 py-3.5 bg-red-600 text-white rounded-xl font-bold shadow-lg btn-press">削除する</button></div>
                            </div>
                        </div>
                    )}
                    {showFinal && <ResultsModal game={game} players={game.players || []} onClose={()=>{ setShowFinal(false); scrollToTop(); }} onEnd={onBack} />}
                    {(game.scores || []).length > 0 && editingIndex === null && <button onClick={() => setUndoConfirm(true)} className="w-full mt-4 text-red-500 text-xs font-bold py-2 flex items-center justify-center gap-1"><i className="fa-solid fa-rotate-left"></i> 直前のホールを削除</button>}
                </div>
            );
        };

        const MedalButton = ({ type, current, onClick, disabled, isReverse }) => {
            const icons = { diamond: '💎', gold: '🥇', silver: '🥈', bronze: '🥉', iron: '🔩' };
            const activeStyle = isReverse ? 'active bg-red-50 border-red-500' : 'active bg-yellow-50 border-yellow-400';
            return <button onClick={onClick} disabled={disabled} className={`w-8 h-8 rounded-full flex items-center justify-center text-sm shadow-sm border transition medal-btn ${disabled ? 'disabled' : ''} ${current === type ? activeStyle : 'bg-white border-gray-200'}`}>{icons[type]}</button>;
        };

        const TeamCard = ({ color, label, pIds, players, scores, setScores, par }) => (
            <div className={`rounded-2xl border-2 p-3 ${color === 'blue' ? 'bg-blue-50 border-blue-100' : 'bg-red-50 border-red-100'}`}>
                <div className={`text-[10px] font-black ${color === 'blue' ? 'text-blue-600' : 'text-red-600'} mb-2`}>{label}</div>
                <div className="flex gap-2">
                    {(pIds || []).map(pid => (
                        <div key={pid} className="flex-1 bg-white/80 backdrop-blur rounded-xl p-2 shadow-sm text-center border border-white/50">
                            <div className="text-[10px] font-bold text-gray-600 truncate mb-1">{players.find(x => x.id === pid)?.name || '未設定'}</div>
                            <input type="tel" inputMode="numeric" pattern="[0-9]*" placeholder={par} value={scores[pid] || ''} onChange={(e) => setScores({...scores, [pid]: e.target.value})} className="w-full text-center text-2xl font-black text-gray-800 bg-transparent rounded border-0 p-1 focus:ring-0 outline-none" />
                        </div>
                    ))}
                </div>
            </div>
        );

        const HistorySection = ({ game, players, onJump }) => {
            if (!game.scores || game.scores.length === 0) return null;
            const medalIcons = { diamond: '💎', gold: '🥇', silver: '🥈', bronze: '🥉', iron: '🔩' };
            const isThree = (game.players || []).length === 3;
            return (
                <div className="space-y-6 mt-8">
                    <div className="bg-white rounded-xl shadow-sm p-4 border border-gray-100">
                        <h3 className="text-[10px] font-bold text-green-600 mb-2 uppercase border-l-4 border-green-500 pl-2 flex justify-between items-center">
                            Score History
                            <span className="text-[8px] text-gray-400 normal-case font-normal">行をタップで修正</span>
                        </h3>
                        <div className="max-h-60 overflow-y-auto no-scrollbar border border-gray-50 rounded-lg">
                            <table className="w-full text-center border-collapse">
                                <thead className="sticky top-0 bg-white z-10"><tr className="text-gray-400 text-[10px]"><th className="p-2 bg-gray-50/95">H</th>{players.map(p => <th key={p.id} className="p-2 font-bold truncate max-w-[60px] bg-gray-50/95">{p.name}</th>)}</tr></thead>
                                <tbody>{(game.scores || []).map((h, i) => (
                                    <tr key={i} className="border-b border-gray-50 active:bg-yellow-50 transition cursor-pointer" onClick={() => onJump(i)}>
                                        <td className="p-2 font-bold text-gray-400 text-[10px]">{h.hole}({h.par || 4})</td>
                                        {players.map(p => {
                                            const sVal = h.scores?.[p.id];
                                            const s = (sVal === undefined || sVal === '') ? '-' : parseInt(sVal);
                                            const d = s === '-' ? null : s - (h.par || 4);
                                            return <td key={p.id} className="p-2"><div className={`text-[11px] font-black rounded-md py-1 ${d === null ? 'text-gray-400 bg-gray-50' : d < 0 ? 'text-blue-600 bg-blue-50' : d > 0 ? 'text-red-500 bg-red-50' : 'text-black bg-gray-100'}`}>{s}</div></td>;
                                        })}
                                    </tr>
                                ))}</tbody>
                            </table>
                        </div>
                    </div>
                    {game.settings?.vegas && (
                        <div className="bg-white rounded-xl shadow-sm p-4 border border-gray-100 animate-fade-in">
                            <h3 className="text-[10px] font-bold text-blue-600 mb-2 uppercase border-l-4 border-blue-500 pl-2">Vegas History</h3>
                            <div className="max-h-40 overflow-y-auto no-scrollbar">
                                <table className="w-full text-center border-collapse text-[10px]">
                                    <thead className="sticky top-0 bg-white z-10"><tr className="text-gray-400 text-[10px]"><th className="p-2 bg-gray-50/95">H</th>{players.map(p => <th key={p.id} className="p-2 font-bold bg-gray-50/95">{p.name}</th>)}</tr></thead>
                                    <tbody>{(game.scores || []).map((h, i) => (<tr key={i} className="border-b border-gray-50 active:bg-blue-50 transition cursor-pointer" onClick={() => onJump(i)}><td className="p-2 text-gray-400 font-bold">{h.hole}</td>{players.map(p => { 
                                        let vP = 0;
                                        if (h.teams?.t1) {
                                            if (isThree) {
                                                if (h.teams.t1.includes(p.id)) vP = h.vegasDiff || 0;
                                                else vP = -(h.vegasDiff || 0) * 2;
                                            } else {
                                                vP = h.teams.t1.includes(p.id) ? (h.vegasDiff || 0) : -(h.vegasDiff || 0);
                                            }
                                        }
                                        return <td key={p.id} className="p-2"><div className={`font-black px-1.5 rounded-md py-1 ${vP > 0 ? 'text-blue-600 bg-blue-50' : vP < 0 ? 'text-red-500 bg-red-50' : 'text-gray-700 bg-gray-100'}`}>{vP > 0 ? '+' : ''}{vP}</div></td>;
                                    })}</tr>))}</tbody>
                                </table>
                            </div>
                        </div>
                    )}
                    {game.settings?.olympic && (
                        <div className="bg-white rounded-xl shadow-sm p-4 border border-gray-100 animate-fade-in">
                            <h3 className="text-[10px] font-bold text-yellow-600 mb-2 uppercase border-l-4 border-yellow-500 pl-2">Olympic History</h3>
                            <div className="max-h-40 overflow-y-auto no-scrollbar border border-gray-50 rounded-lg">
                                <table className="w-full text-center border-collapse text-[10px]">
                                    <thead className="sticky top-0 bg-white z-10"><tr className="text-gray-400 text-[10px]"><th className="p-2 bg-gray-50/95">H</th>{players.map(p => <th key={p.id} className="p-2 font-bold bg-gray-50/95">{p.name}</th>)}</tr></thead>
                                    <tbody>{(game.scores || []).map((h, i) => (<tr key={i} className="border-b border-gray-50 last:border-0 active:bg-yellow-50 transition cursor-pointer" onClick={() => onJump(i)}><td className="p-2 text-gray-400 font-bold">{h.hole}</td>{players.map(p => { const oP = h.olympicPoints?.[p.id] || 0; return <td key={p.id} className="p-1"><div className={`font-black px-1 rounded-md py-1 flex items-center justify-center gap-0.5 ${oP > 0 ? 'text-blue-600 bg-blue-50' : oP < 0 ? 'text-red-500 bg-red-50' : 'text-gray-700 bg-gray-100'}`}>{h.medals?.[p.id] && <span>{medalIcons[h.medals[p.id]]}</span>}<span>{oP > 0 ? '+' : ''}{oP}</span></div></td>;})}</tr>))}</tbody>
                                </table>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const ResultsModal = ({ game, players, onClose, onEnd }) => {
            const getPlayerScore = (pId) => {
                const history = game.scores || [];
                const outHoles = history.filter(h => h.hole <= 9);
                const inHoles = history.filter(h => h.hole > 9);
                const calc = (holes) => ({ strokes: holes.reduce((s, h) => s + (parseInt(h.scores?.[pId]) || 0), 0), pars: holes.reduce((s, h) => s + (h.par || 0), 0) });
                const o = calc(outHoles), i = calc(inHoles);
                return { out: o.strokes, in: i.strokes, total: o.strokes + i.strokes, diff: (o.strokes + i.strokes) - (o.pars + i.pars) };
            };
            return (
                <div className="fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-[100] backdrop-blur-sm animate-fade-in">
                    <div className="bg-white rounded-3xl w-full max-sm p-6 text-center shadow-2xl relative overflow-hidden max-h-[90vh] flex flex-col">
                        <div className="absolute top-0 left-0 w-full h-2 bg-green-600"></div>
                        <h3 className="text-gray-800 text-xl font-black mb-4 mt-2 tracking-tighter">結果一覧</h3>
                        <div className="flex-1 overflow-y-auto no-scrollbar space-y-4 mb-6 text-left">
                            {game.settings?.vegas && (
                                <div className="p-4 rounded-2xl bg-blue-50 border border-blue-100">
                                    <h4 className="text-[10px] font-bold text-blue-600 mb-3 border-b border-blue-200 pb-1 uppercase">Vegas Results</h4>
                                    <div className="space-y-2">{players.map(p => { const v = game.totalVegasPoints ? (game.totalVegasPoints[p.id] || 0) : 0; return <div key={p.id} className="flex justify-between items-center text-sm font-bold"><span className="text-gray-600">{p.name}</span><span className={v >= 0 ? 'text-blue-600' : 'text-red-500'}>{v > 0 ? '+' : ''}{v}</span></div>;})}</div>
                                </div>
                            )}
                            {game.settings?.olympic && (
                                <div className="p-4 rounded-2xl bg-yellow-50 border border-yellow-100">
                                    <h4 className="text-[10px] font-bold text-yellow-600 mb-3 border-b border-yellow-200 pb-1 uppercase">Olympic Relative (授受点)</h4>
                                    <div className="space-y-2">{players.map(p => { const r = calcOlympicRelative(p.id, game.totalOlympicPoints || {}); const raw = game.totalOlympicPoints ? (game.totalOlympicPoints[p.id] || 0) : 0; return <div key={p.id} className="flex justify-between items-center text-sm font-bold"><span className="text-gray-600">{p.name}</span><div className="flex items-center gap-2"><span className={r >= 0 ? 'text-blue-600' : 'text-red-500'}>{r > 0 ? '+' : ''}{r}</span><span className="text-[10px] text-gray-400 font-medium">({raw > 0 ? '+' : ''}{raw})</span></div></div>;})}</div>
                                </div>
                            )}
                            <div className="p-4 rounded-2xl bg-green-50 border border-green-100">
                                <h4 className="text-[10px] font-bold text-green-600 mb-3 border-b border-green-200 pb-1 uppercase">Total Strokes</h4>
                                <div className="space-y-2">{players.map(p => { const res = getPlayerScore(p.id); return <div key={p.id} className="flex justify-between items-center text-sm font-bold"><span className="text-gray-600 w-16 truncate text-left">{p.name}</span><div className="flex-1 flex justify-end items-center gap-3 text-right"><span className="text-[10px] text-gray-700">O:{res.out}</span><span className="text-[10px] text-gray-700">I:{res.in}</span><span className="text-sm font-black">T:{res.total}</span><span className={`min-w-[28px] text-right text-sm font-black ${res.diff <= 0 ? 'text-blue-600' : 'text-red-500'}`}>{res.diff === 0 ? 'E' : (res.diff > 0 ? '+' + res.diff : res.diff)}</span></div></div>;})}</div>
                            </div>
                        </div>
                        <div className="flex gap-3"><button onClick={() => { onEnd(); window.scrollTo({top:0}); }} className="flex-1 py-4 bg-red-600 text-white rounded-2xl font-bold shadow-lg btn-press">終了</button><button onClick={() => { onClose(); window.scrollTo({top:0}); }} className="flex-1 py-4 bg-green-600 text-white rounded-2xl font-bold shadow-md btn-press">戻る</button></div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
